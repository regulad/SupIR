name: "Gradle Tasks"

on:
  push:
    branches:
      - master
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - master
  schedule:
    # ensures that workflow runs AT LEAST every 60 days to keep artifacts downloadable
    - cron: "0 3 15 */2 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # - setup java
    # - setup gradle cache
    # - setup android sdk
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
          # we don't need to declare any additional cache paths, the cache already catches everything
      - uses: android-actions/setup-android@v3
      - run: "chmod +x ./gradlew"  # this project is used from windows, so it can be messed up
      - if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        name: "Build Debug APK"
        run: "./gradlew build --no-daemon"
      - if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        name: "Upload Debug APK"
        uses: actions/upload-artifact@v4
        with:
          path: |
            app/build/outputs/apk/debug/app-debug.apk
      # The release key is kept in signing.sops.yaml, encrypted to this
      # repository's own age key (the SOPS_AGE_KEY secret) and Parker's. Its
      # one password opens both the keystore and the key.
      - if: startsWith(github.ref, 'refs/tags/')
        name: Install SOPS
        run: |
          curl -fsSLo "$RUNNER_TEMP/sops" https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          echo "e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b  $RUNNER_TEMP/sops" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/sops"
      - if: startsWith(github.ref, 'refs/tags/')
        name: Decrypt the signing key
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          secrets=signing.sops.yaml
          password="$("$RUNNER_TEMP/sops" decrypt --extract '["password"]' "$secrets")"
          echo "::add-mask::$password"
          "$RUNNER_TEMP/sops" decrypt --extract '["keystore"]' "$secrets" | base64 -d > "$RUNNER_TEMP/release.p12"
          {
            echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.p12"
            echo "RELEASE_KEY_ALIAS=$("$RUNNER_TEMP/sops" decrypt --extract '["alias"]' "$secrets")"
            echo "RELEASE_KEYSTORE_PASSWORD=$password"
          } >> "$GITHUB_ENV"
      - if: startsWith(github.ref, 'refs/tags/')
        name: Build Release APK
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RELEASE_KEYSTORE" \
            -Pandroid.injected.signing.store.password="$RELEASE_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$RELEASE_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$RELEASE_KEYSTORE_PASSWORD"
      - if: startsWith(github.ref, 'refs/tags/')
        name: Upload Release APK
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
